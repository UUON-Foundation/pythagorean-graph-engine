<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>F = (P, E, R, C) — Pythagorean Graph Engine</title>
<desc>Five parameters P flow through deterministic encoding E to produce any representation R at compression ratio C</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  text { font-family: sans-serif; fill: #111; }
  .th  { font-size: 14px; font-weight: 600; }
  .ts  { font-size: 12px; fill: #555; }
  .arr { stroke: #888; stroke-width: 1.5; fill: none; }
</style>

<!-- Title -->
<text class="th" x="340" y="38" text-anchor="middle" font-size="18">F = (P, E, R, C)</text>
<text class="ts" x="340" y="58" text-anchor="middle">Five numbers in. Any geometry out. Always the same result.</text>

<!-- P box -->
<rect x="40" y="90" width="180" height="130" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="130" y="118" text-anchor="middle" fill="#3C3489">P — Parameters</text>
<text class="ts" x="130" y="138" text-anchor="middle">The seed</text>
<text class="ts" x="60" y="160">angle</text>
<text class="ts" x="60" y="177">depth</text>
<text class="ts" x="60" y="194">scale</text>
<text class="ts" x="130" y="160">growth</text>
<text class="ts" x="130" y="177">mode</text>
<text class="ts" x="60" y="210">≈ 40 bytes total</text>

<!-- P→E arrow -->
<line x1="220" y1="155" x2="268" y2="155" class="arr" marker-end="url(#arrow)" stroke="#7F77DD"/>

<!-- E box -->
<rect x="270" y="90" width="180" height="130" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="360" y="118" text-anchor="middle" fill="#085041">E — Encoding</text>
<text class="ts" x="360" y="138" text-anchor="middle">Deterministic topology</text>
<text class="ts" x="290" y="160">recursive branching</text>
<text class="ts" x="290" y="177">parent-child graph</text>
<text class="ts" x="290" y="194">node positions</text>
<text class="ts" x="290" y="210">edge radii</text>

<!-- E→R arrow -->
<line x1="450" y1="155" x2="498" y2="155" class="arr" marker-end="url(#arrow)" stroke="#1D9E75"/>

<!-- R box -->
<rect x="500" y="90" width="140" height="130" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="570" y="118" text-anchor="middle" fill="#633806">R — Output</text>
<text class="ts" x="570" y="138" text-anchor="middle">Any format</text>
<text class="ts" x="520" y="160">3D mesh</text>
<text class="ts" x="520" y="177">OBJ / STL</text>
<text class="ts" x="520" y="194">graph JSON</text>
<text class="ts" x="520" y="210">point cloud</text>

<!-- Divider -->
<line x1="40" y1="255" x2="640" y2="255" stroke="#ccc" stroke-width="0.5"/>

<!-- C section -->
<text class="th" x="340" y="285" text-anchor="middle">C — Compression ratio</text>
<text class="ts" x="340" y="303" text-anchor="middle">40 bytes of P produces this many vertices in R</text>

<!-- Bars -->
<rect x="60"  y="320" width="28" height="16" rx="3" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
<text class="ts" x="74" y="352" text-anchor="middle">depth 2</text>
<text class="ts" x="74" y="367" text-anchor="middle">200:1</text>

<rect x="120" y="315" width="28" height="21" rx="3" fill="#AFA9EC" stroke="#7F77DD" stroke-width="0.5"/>
<text class="ts" x="134" y="352" text-anchor="middle">depth 3</text>
<text class="ts" x="134" y="367" text-anchor="middle">800:1</text>

<rect x="180" y="304" width="28" height="32" rx="3" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="194" y="352" text-anchor="middle">depth 4</text>
<text class="ts" x="194" y="367" text-anchor="middle">3,200:1</text>

<rect x="240" y="282" width="28" height="54" rx="3" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
<text class="ts" x="254" y="352" text-anchor="middle">depth 5</text>
<text class="ts" x="254" y="367" text-anchor="middle">12,800:1</text>

<rect x="300" y="240" width="28" height="96" rx="3" fill="#3C3489" stroke="#26215C" stroke-width="0.5"/>
<text class="ts" x="314" y="352" text-anchor="middle">depth 6</text>
<text class="ts" x="314" y="367" text-anchor="middle">51,200:1</text>

<!-- What this means -->
<rect x="380" y="310" width="260" height="130" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="510" y="333" text-anchor="middle">What this means</text>
<text class="ts" x="400" y="356">AI agent: store P, not the mesh</text>
<text class="ts" x="400" y="374">IoT device: reconstruct on demand</text>
<text class="ts" x="400" y="392">Verification: hash E, not R</text>
<text class="ts" x="400" y="410">Any renderer: same P, same result</text>
<text class="ts" x="400" y="428">40 bytes replaces megabytes</text>

<!-- Footer -->
<text class="ts" x="340" y="490" text-anchor="middle">Origin: Phillip Aguilar Ruiz III — UUON Foundation</text>
<text class="ts" x="340" y="508" text-anchor="middle">pythagorean-graph-engine — USAL-1.0</text>
</svg>
